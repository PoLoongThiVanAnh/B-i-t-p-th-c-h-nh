<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Chèn Icon HTML</title>
    <!-- Nhúng thư viện Icon Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* Tùy chỉnh màu sắc và kích thước cho icon dễ dàng bằng CSS */
        
        .icon-tim {
            color: red;
            font-size: 24px;
        }
    </style>
</head>

<body>

    <h2>Danh sách Icon:</h2>
    <p><i class="fa-solid fa-heart icon-tim"></i></p>
    <p><i class="fa-solid fa-envelope icon-email"></i> </p>
    <p><i class="fa-solid fa-phone icon-dienthoai"></i></p>

</body>

</html>
